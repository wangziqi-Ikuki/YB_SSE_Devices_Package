name: Check Device Registry

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Miniforge (with mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          python-version: '3.11.14'
          channels: conda-forge,robostack-staging,uni-lab,defaults
          channel-priority: flexible
          activate-environment: unilab
          auto-update-conda: false

      - name: Install unilabos
        shell: bash -el {0}
        run: |
          mamba install -n unilab uni-lab::unilabos -c uni-lab -c robostack-staging -c conda-forge -y

      - name: Validate package, catalog and deployment graphs
        shell: bash -el {0}
        run: |
          YB_STRICT_ACTION_RESULTS=1 ./scripts/check-package.sh

      - name: Run package tests
        shell: bash -el {0}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pip install pytest
          python -m pytest tests -q

      - name: Build clean package artifact
        shell: bash -el {0}
        run: |
          ./scripts/build-package.sh "$RUNNER_TEMP/yb-package-artifacts"
